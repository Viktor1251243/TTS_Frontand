<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ZELVIA  AI VOICE STUDIO</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#1A1B26;
    --panel:#24283B;
    --panel-alt:#292E42;
    --border:#3B4261;
    --text:#ECEDF1;
    --text-muted:#A9B1D6;
    --amber:#3B82F6; /* Changed to blue */
    --green:#35D68A;
    --red:#FF5D5D;
    --theme-transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; -webkit-tap-highlight-color: transparent;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(122, 162, 247, 0.1), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 16px 200px; /* extra bottom padding for sticky transport and player */
    transition: var(--theme-transition);
  }
  .console{
    width:100%;
    max-width:100%;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--text-muted);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .eyebrow .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:34px;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  .sub{
    color:var(--text-muted);
    font-size:14.5px;
    margin:0 0 28px;
    max-width:46ch;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
    transition: var(--theme-transition);
  }
  .panel.is-busy .busy-overlay{
    opacity:1;
    pointer-events:auto;
  }
  .busy-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    background:rgba(26, 27, 38, 0.82);
    backdrop-filter:blur(6px);
    border-radius:16px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:5;
  }
  .busy-visual{
    display:flex;
    align-items:center;
    gap:6px;
    height:44px;
    padding:10px 20px;
    border:1px solid var(--border);
    border-radius:999px;
    background:rgba(59, 130, 246, 0.06);
    box-shadow:0 0 28px rgba(59, 130, 246, 0.1);
  }
  .eq-bar{
    width:4px;
    height:10px;
    border-radius:3px;
    background:linear-gradient(180deg, var(--amber), var(--green));
    animation:eqPulse 1.1s ease-in-out infinite;
  }
  .eq-bar:nth-child(1){animation-delay:0s;}
  .eq-bar:nth-child(2){animation-delay:.12s;}
  .eq-bar:nth-child(3){animation-delay:.24s;}
  .eq-bar:nth-child(4){animation-delay:.36s;}
  .eq-bar:nth-child(5){animation-delay:.48s;}
  .eq-bar:nth-child(6){animation-delay:.36s;}
  .eq-bar:nth-child(7){animation-delay:.24s;}
  .eq-bar:nth-child(8){animation-delay:.12s;}
  @keyframes eqPulse{
    0%, 100%{height:8px; opacity:.6;}
    50%{height:26px; opacity:1;}
  }
  .busy-text{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--amber);
    display:flex;
    align-items:center;
  }
  .busy-text .dot-anim span{
    opacity:0;
    animation:dotFade 1.2s infinite;
  }
  .busy-text .dot-anim span:nth-child(1){animation-delay:0s;}
  .busy-text .dot-anim span:nth-child(2){animation-delay:.2s;}
  .busy-text .dot-anim span:nth-child(3){animation-delay:.4s;}
  @keyframes dotFade{
    0%, 80%, 100%{opacity:0;}
    40%{opacity:1;}
  }
  .panel-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:12px;
    transition: color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.5;
    padding:16px;
    outline:none;
    transition: var(--theme-transition);
  }
  textarea:focus{border-color:var(--amber);}
  .charcount{
    text-align:right;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
    margin-top:8px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  .field label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:10px;
    transition: color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  select, input[type="number"], input[type="text"], input[type="range"]{
    width:100%;
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:12px;
    padding:14px 16px;
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    outline:none;
    transition: var(--theme-transition);
  }
  select:focus, input:focus{border-color:var(--amber);}
  input[type="range"]{
    padding:0;
    border:none;
    background:transparent;
    appearance:none;
    -webkit-appearance:none;
    height:8px;
    border-radius:999px;
    background:linear-gradient(90deg, var(--amber), var(--green));
    transition: var(--theme-transition);
  }
  input[type="range"]::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--text);
    border:2px solid var(--amber);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--text);
    border:2px solid var(--amber);
    cursor:pointer;
  }

  .transport{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(26, 27, 38, 0.95);
    backdrop-filter: blur(10px);
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    z-index: 100;
    transition: var(--theme-transition);
  }
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:12px;
    padding:16px 12px;
    cursor:pointer;
    transition: var(--theme-transition), transform .08s, opacity .15s;
    width: 100%;
  }
  button:active{transform:scale(0.96); transition: transform 0.08s;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  .btn-primary{
    background:var(--amber);
    color:#fff;
  }
  .btn-secondary{
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn-secondary:hover{border-color:var(--green);}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
  }
  .btn-icon {
    width: auto;
    padding: 8px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .status{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
    margin-top:14px;
    min-height:16px;
    text-align: center;
  }
  .status.err{color:var(--red);}
  .status.ok{color:var(--green);}

  /* === ПЕРЕКЛЮЧЕНИЕ РЕКЛАМЫ === */
  .desktop-ad {
    display: none !important;
  }
  .mobile-ad {
    display: block !important;
  }
  
  .header-container {
    margin-bottom: 24px;
  }
  .header-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.2), 0 0 10px rgba(255, 255, 255, 0.1);
  }
  .header-desc {
    text-align: left;
    margin: 8px 0 0 0;
    font-size: 16px;
    font-weight: normal;
    color: var(--text-muted);
  }
  .tg-link {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    background: var(--panel-alt);
    padding: 8px 12px;
    border-radius: 99px;
    border: 1px solid var(--border);
    color: var(--text);
    transition: var(--theme-transition);
  }

  /* Audio Player UI */
  .player-ui {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
    display: none;
    align-items: center;
    gap: 12px;
    transition: var(--theme-transition);
  }
  .player-ui.active {
    display: flex;
  }
  .player-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .player-progress-container {
    flex-grow: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .player-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    min-width: 45px;
  }
  .progress-bar {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    outline: none;
    cursor: pointer;
    transition: var(--theme-transition);
  }
  .progress-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--amber);
    cursor: pointer;
  }

  /* History Section */
  .history-section {
    margin-top: 32px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .history-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: var(--theme-transition);
  }
  .history-info {
    flex-grow: 1;
    overflow: hidden;
  }
  .history-title {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .history-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .history-actions {
    display: flex;
    gap: 6px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>

<script>
const API_BASE = 'https://tts-backend-77rf.onrender.com';

const els = {
  text: document.getElementById('text'),
  charcount: document.getElementById('charcount'),
  voice: document.getElementById('voice'),
  rate: document.getElementById('rate'),
  pitch: document.getElementById('pitch'),
  rateValue: document.getElementById('rateValue'),
  pitchValue: document.getElementById('pitchValue'),
  genBtn: document.getElementById('genBtn'),
  clearBtn: document.getElementById('clearBtn'),
  status: document.getElementById('status'),
  player: document.getElementById('player'),
  
  playerUi: document.getElementById('playerUi'),
  playPauseBtn: document.getElementById('playPauseBtn'),
  playIcon: document.getElementById('playIcon'),
  pauseIcon: document.getElementById('pauseIcon'),
  progressBar: document.getElementById('progressBar'),
  currentTime: document.getElementById('currentTime'),
  durationTime: document.getElementById('durationTime'),
  historyList: document.getElementById('historyList')
};

const textPanel = document.querySelector('[data-panel="text"]');
const paramsPanel = document.querySelector('[data-panel="params"]');
let currentBlobUrl = null;
let historyData = [];

// Try to load history from localStorage on startup
try {
  const savedHistory = localStorage.getItem('zelvia_history');
  if (savedHistory) {
    historyData = JSON.parse(savedHistory);
  }
} catch (e) {
  console.error('Failed to load history from localStorage', e);
}

function addToHistory(text, voice, url) {
  const newItem = {
    text: text,
    voice: voice,
    url: url,
    timestamp: new Date().getTime()
  };
  // Prepend to show newest first
  historyData.unshift(newItem);
  
  // Keep history manageable (e.g., max 20 items)
  if (historyData.length > 20) {
    historyData = historyData.slice(0, 20);
  }
  
  try {
    localStorage.setItem('zelvia_history', JSON.stringify(historyData));
  } catch(e) {
    console.error('Failed to save history', e);
  }
  
  renderHistory();
}

els.text.addEventListener('input', () => {
  els.charcount.textContent = els.text.value.length;
});

els.rate.addEventListener('input', syncSliderLabels);
els.pitch.addEventListener('input', syncSliderLabels);

els.clearBtn.addEventListener('click', () => {
  els.text.value = '';
  els.charcount.textContent = '0';
  els.text.focus();
});

function setStatus(msg, kind) {
  els.status.textContent = msg;
  els.status.className = 'status' + (kind ? ' ' + kind : '');
}

function formatRateValue(value) {
  const normalized = Number.parseInt(value, 10) || 0;
  return `${normalized >= 0 ? '+' : ''}${normalized}%`;
}

function formatPitchValue(value) {
  const normalized = Number.parseInt(value, 10) || 0;
  return `${normalized >= 0 ? '+' : ''}${normalized}Hz`;
}

function syncSliderLabels() {
  els.rateValue.textContent = formatRateValue(els.rate.value);
  els.pitchValue.textContent = formatPitchValue(els.pitch.value);
}

function setBusy(busy) {
  els.genBtn.disabled = busy;
  els.genBtn.textContent = busy ? 'Генерация…' : 'Сгенерировать';
  els.text.disabled = busy;
  els.voice.disabled = busy;
  els.rate.disabled = busy;
  els.pitch.disabled = busy;
  els.clearBtn.disabled = busy;
  textPanel.classList.toggle('is-busy', busy);
  paramsPanel.classList.toggle('is-busy', busy);
}

// Player Logic
function formatTime(seconds) {
  if (isNaN(seconds)) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

els.player.addEventListener('timeupdate', () => {
  if (!els.player.duration) return;
  els.currentTime.textContent = formatTime(els.player.currentTime);
  els.progressBar.value = (els.player.currentTime / els.player.duration) * 100;
});

els.player.addEventListener('loadedmetadata', () => {
  els.durationTime.textContent = formatTime(els.player.duration);
});

els.player.addEventListener('play', () => {
  els.playIcon.style.display = 'none';
  els.pauseIcon.style.display = 'block';
});

els.player.addEventListener('pause', () => {
  els.playIcon.style.display = 'block';
  els.pauseIcon.style.display = 'none';
});

els.player.addEventListener('ended', () => {
  els.playIcon.style.display = 'block';
  els.pauseIcon.style.display = 'none';
  els.progressBar.value = 0;
  els.currentTime.textContent = "0:00";
});

els.playPauseBtn.addEventListener('click', () => {
  if (els.player.paused) {
    els.player.play();
  } else {
    els.player.pause();
  }
});

els.progressBar.addEventListener('input', (e) => {
  if (els.player.duration) {
    els.player.currentTime = (e.target.value / 100) * els.player.duration;
  }
});

function loadAudioToPlayer(blobUrl) {
  if (currentBlobUrl && currentBlobUrl !== blobUrl && currentBlobUrl.startsWith('blob:')) {
    // Keep blobs around if they are in history, otherwise careful with revoke
  }
  currentBlobUrl = blobUrl;
  els.player.src = currentBlobUrl;
  els.playerUi.classList.add('active');
  els.player.play().catch(e => console.log('Auto-play prevented', e));
}

// History Logic
function renderHistory() {
  els.historyList.innerHTML = '';
  if (historyData.length === 0) {
    els.historyList.innerHTML = '<div class="status">История пуста</div>';
    return;
  }
  
  historyData.forEach((item, index) => {
    const el = document.createElement('div');
    el.className = 'history-item';
    el.innerHTML = `
      <div class="history-info">
        <div class="history-title">${item.text.substring(0, 40)}${item.text.length > 40 ? '...' : ''}</div>
        <div class="history-meta">${new Date(item.timestamp).toLocaleTimeString()} • ${VOICE_LABELS[item.voice] || item.voice}</div>
      </div>
      <div class="history-actions">
        <button class="btn-secondary btn-icon play-hist" data-index="${index}" title="Слушать">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn-secondary btn-icon dl-hist" data-index="${index}" title="Скачать">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>
        <button class="btn-ghost btn-icon del-hist" data-index="${index}" title="Удалить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
      </div>
    `;
    els.historyList.appendChild(el);
  });

  // Attach events
  document.querySelectorAll('.play-hist').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = e.currentTarget.getAttribute('data-index');
      loadAudioToPlayer(historyData[idx].url);
    });
  });
  
  document.querySelectorAll('.dl-hist').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = e.currentTarget.getAttribute('data-index');
      const a = document.createElement('a');
      a.href = historyData[idx].url;
      a.download = `voice_${historyData[idx].timestamp}.mp3`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
  });

  document.querySelectorAll('.del-hist').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = e.currentTarget.getAttribute('data-index');
      // If deleting currently playing, clear player
      if (currentBlobUrl === historyData[idx].url) {
        els.player.pause();
        els.playerUi.classList.remove('active');
        currentBlobUrl = null;
      }
      historyData.splice(idx, 1);
      try {
        localStorage.setItem('zelvia_history', JSON.stringify(historyData));
      } catch(err) {}
      renderHistory();
    });
  });
}

// Загрузка списка голосов
const FALLBACK_VOICES = ["ru-RU-DmitryNeural", "ru-RU-SvetlanaNeural", "en-US-AvaNeural", "en-US-AndrewNeural", "fr-FR-RemyMultilingualNeural", "fr-FR-VivienneMultilingualNeural", "es-ES-AlvaroNeural", "es-ES-ElviraNeural"];

const VOICE_LABELS = {
  "ru-RU-DmitryNeural": "Русский Мужской",
  "ru-RU-SvetlanaNeural": "Русский Женский",
  "en-US-AvaNeural": "Английский Женский",
  "en-US-AndrewNeural": "Английский Мужской",
  "fr-FR-RemyMultilingualNeural": "Французский Мужской",
  "fr-FR-VivienneMultilingualNeural": "Французский Женский",
  "es-ES-AlvaroNeural": "Испанский мужской",
  "es-ES-ElviraNeural": "Испанский женский",
};

function fillSelect(select, options, selected) {
  select.innerHTML = '';
  options.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = VOICE_LABELS[opt] || opt;
    if (opt === selected) o.selected = true;
    select.appendChild(o);
  });
}

async function loadVoices() {
  fillSelect(els.voice, FALLBACK_VOICES);
  syncSliderLabels();
  renderHistory();

  try {
    const res = await fetch(`${API_BASE}/api/voices`);
    if (!res.ok) throw new Error('bad status ' + res.status);
    const data = await res.json();
    if (data.voices && data.voices.length) fillSelect(els.voice, data.voices);
  } catch (e) {
    setStatus('Сервис временно недоступен, попробуйте позже.', 'err');
  }
}

// Генерация
els.genBtn.addEventListener('click', async () => {
  const text = els.text.value.trim();
  if (!text) { setStatus('Введите текст.', 'err'); return; }

  setBusy(true);
  setStatus('Отправка запроса на генерацию…', '');

  const payload = {
    text,
    voice: els.voice.value,
    rate: formatRateValue(els.rate.value),
    pitch: formatPitchValue(els.pitch.value),
  };

  try {
    const res = await fetch(`${API_BASE}/api/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody.detail || `Ошибка сервера (${res.status})`);
    }
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    
    addToHistory(text, els.voice.value, blobUrl);
    loadAudioToPlayer(blobUrl);

    setStatus('Готово.', 'ok');
  } catch (e) {
    setStatus('Ошибка: ' + e.message, 'err');
  } finally {
    setBusy(false);
  }
});


// Инициализация
loadVoices();
</script>
<script>
(function() {
  const themeBtn = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const body = document.body;

  themeBtn.addEventListener('click', () => {
    // Ensure clean class toggle and trigger CSS transitions via a slight delay if necessary, 
    // though classList.toggle naturally triggers transitions perfectly.
    requestAnimationFrame(() => {
      body.classList.toggle('light-theme');
      const isLight = body.classList.contains('light-theme');
      themeIcon.textContent = isLight ? 'dark_mode' : 'light_mode';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
  });

  if (localStorage.getItem('theme') === 'light') {
    body.classList.add('light-theme');
    themeIcon.textContent = 'dark_mode';
  }
})();
</script></body></html>
