<html lang="ru">
<head>

<title>ZELVIA  AI VOICE STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0F;
    --panel:#14161D;
    --panel-alt:#1B1E27;
    --border:#262932;
    --text:#ECEDF1;
    --text-muted:#888C98;
    --amber:#FFB020;
    --green:#35D68A;
    --red:#FF5D5D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,176,32,0.07), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px 80px;
  }
  .console{
    width:100%;
    max-width:640px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--text-muted);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .eyebrow .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:34px;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  .sub{
    color:var(--text-muted);
    font-size:14.5px;
    margin:0 0 28px;
    max-width:46ch;
  }

  /* --- signature: live waveform strip --- */
  #meter{
    width:100%;
    height:64px;
    display:block;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:22px;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .panel.is-busy .busy-overlay{
    opacity:1;
    pointer-events:auto;
  }
  .busy-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    background:rgba(10, 11, 15, 0.82);
    backdrop-filter:blur(6px);
    border-radius:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:5;
  }
  .busy-visual{
    display:flex;
    align-items:center;
    gap:6px;
    height:44px;
    padding:10px 20px;
    border:1px solid var(--border);
    border-radius:999px;
    background:rgba(255,176,32,0.06);
    box-shadow:0 0 28px rgba(255,176,32,0.1);
  }
  .eq-bar{
    width:4px;
    height:10px;
    border-radius:3px;
    background:linear-gradient(180deg, var(--amber), var(--green));
    animation:eqPulse 1.1s ease-in-out infinite;
  }
  .eq-bar:nth-child(1){animation-delay:0s;}
  .eq-bar:nth-child(2){animation-delay:.12s;}
  .eq-bar:nth-child(3){animation-delay:.24s;}
  .eq-bar:nth-child(4){animation-delay:.36s;}
  .eq-bar:nth-child(5){animation-delay:.48s;}
  .eq-bar:nth-child(6){animation-delay:.36s;}
  .eq-bar:nth-child(7){animation-delay:.24s;}
  .eq-bar:nth-child(8){animation-delay:.12s;}
  @keyframes eqPulse{
    0%, 100%{height:8px; opacity:.6;}
    50%{height:26px; opacity:1;}
  }
  .busy-text{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--amber);
    display:flex;
    align-items:center;
  }
  .busy-text .dot-anim span{
    opacity:0;
    animation:dotFade 1.2s infinite;
  }
  .busy-text .dot-anim span:nth-child(1){animation-delay:0s;}
  .busy-text .dot-anim span:nth-child(2){animation-delay:.2s;}
  .busy-text .dot-anim span:nth-child(3){animation-delay:.4s;}
  @keyframes dotFade{
    0%, 80%, 100%{opacity:0;}
    40%{opacity:1;}
  }
  .panel-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
    padding:14px;
    outline:none;
  }
  textarea:focus{border-color:var(--amber);}
  .charcount{
    text-align:right;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
    margin-top:6px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
  }
  .field label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:8px;
  }
  select, input[type="number"], input[type="text"], input[type="range"]{
    width:100%;
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    outline:none;
  }
  select:focus, input:focus{border-color:var(--amber);}
  input[type="range"]{
    padding:0;
    border:none;
    background:transparent;
    appearance:none;
    -webkit-appearance:none;
    height:6px;
    border-radius:999px;
    background:linear-gradient(90deg, var(--amber), var(--green));
  }
  input[type="range"]::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--text);
    border:2px solid var(--amber);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--text);
    border:2px solid var(--amber);
    cursor:pointer;
  }
  .panel-note{
    margin-top:10px;
    color:var(--text-muted);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    line-height:1.5;
  }

  .transport{
    display:flex;
    gap:10px;
    margin-top:4px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:99px;
    padding:13px 18px;
    cursor:pointer;
    transition:transform .08s, opacity .15s;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:.35;cursor:not-allowed;}
  .btn-primary{
    background:var(--amber);
    color:#161200;
    flex:1.4;
  }
  .btn-secondary{
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    flex:1;
  }
  .btn-secondary:hover{border-color:var(--green);}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
    flex:1;
  }

  .status{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
    margin-top:14px;
    min-height:16px;
  }
  .status.err{color:var(--red);}
  .status.ok{color:var(--green);}

  footer{
    text-align:center;
    color:var(--text-muted);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    margin-top:30px;
    opacity:.6;
  }

  /* === ПЕРЕКЛЮЧЕНИЕ РЕКЛАМЫ (DESKTOP / MOBILE) === */
  .mobile-ad {
    display: none !important;
  }
  .desktop-ad {
    display: block !important;
  }

  @media (max-width: 767px) {
    .grid{grid-template-columns:1fr;}
    .transport{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr));}
    .transport button{width:100%;}
    h1{font-size:27px;}

    /* На мобильных скрываем десктопную рекламу и показываем мобильную */
    .desktop-ad {
      display: none !important;
    }
    .mobile-ad {
      display: block !important;
    }
  }
</style>

<script>
const API_BASE = 'https://tts-backend-77rf.onrender.com';

const els = {
  text: document.getElementById('text'),
  charcount: document.getElementById('charcount'),
  voice: document.getElementById('voice'),
  rate: document.getElementById('rate'),
  pitch: document.getElementById('pitch'),
  rateValue: document.getElementById('rateValue'),
  pitchValue: document.getElementById('pitchValue'),
  genBtn: document.getElementById('genBtn'),
  playBtn: document.getElementById('playBtn'),
  downloadBtn: document.getElementById('downloadBtn'),
  clearBtn: document.getElementById('clearBtn'),
  status: document.getElementById('status'),
  player: document.getElementById('player'),
};

const textPanel = document.querySelector('[data-panel="text"]');
const paramsPanel = document.querySelector('[data-panel="params"]');
let currentBlobUrl = null;

els.text.addEventListener('input', () => {
  els.charcount.textContent = els.text.value.length;
});

els.rate.addEventListener('input', syncSliderLabels);
els.pitch.addEventListener('input', syncSliderLabels);

els.clearBtn.addEventListener('click', () => {
  els.text.value = '';
  els.charcount.textContent = '0';
  els.text.focus();
});

function setStatus(msg, kind) {
  els.status.textContent = msg;
  els.status.className = 'status' + (kind ? ' ' + kind : '');
}

function formatRateValue(value) {
  const normalized = Number.parseInt(value, 10) || 0;
  return `${normalized >= 0 ? '+' : ''}${normalized}%`;
}

function formatPitchValue(value) {
  const normalized = Number.parseInt(value, 10) || 0;
  return `${normalized >= 0 ? '+' : ''}${normalized}Hz`;
}

function syncSliderLabels() {
  els.rateValue.textContent = formatRateValue(els.rate.value);
  els.pitchValue.textContent = formatPitchValue(els.pitch.value);
}

function setBusy(busy) {
  els.genBtn.disabled = busy;
  els.genBtn.textContent = busy ? 'Генерация…' : 'Сгенерировать';
  els.text.disabled = busy;
  els.voice.disabled = busy;
  els.rate.disabled = busy;
  els.pitch.disabled = busy;
  els.clearBtn.disabled = busy;
  textPanel.classList.toggle('is-busy', busy);
  paramsPanel.classList.toggle('is-busy', busy);
}

// Загрузка списка голосов
const FALLBACK_VOICES = ["ru-RU-DmitryNeural", "ru-RU-SvetlanaNeural", "en-US-AvaNeural", "en-US-AndrewNeural"];

function fillSelect(select, options, selected) {
  select.innerHTML = '';
  options.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = opt;
    if (opt === selected) o.selected = true;
    select.appendChild(o);
  });
}

async function loadVoices() {
  fillSelect(els.voice, FALLBACK_VOICES);
  syncSliderLabels();

  try {
    const res = await fetch(`${API_BASE}/api/voices`);
    if (!res.ok) throw new Error('bad status ' + res.status);
    const data = await res.json();
    if (data.voices && data.voices.length) fillSelect(els.voice, data.voices);
  } catch (e) {
    setStatus('Сервис временно недоступен, попробуйте позже.', 'err');
  }
}

// Генерация
els.genBtn.addEventListener('click', async () => {
  const text = els.text.value.trim();
  if (!text) { setStatus('Введите текст.', 'err'); return; }

  setBusy(true);
  setStatus('Отправка запроса на генерацию…', '');
  els.playBtn.disabled = true;
  els.downloadBtn.disabled = true;

  const payload = {
    text,
    voice: els.voice.value,
    rate: formatRateValue(els.rate.value),
    pitch: formatPitchValue(els.pitch.value),
  };

  try {
    const res = await fetch(`${API_BASE}/api/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody.detail || `Ошибка сервера (${res.status})`);
    }
    const blob = await res.blob();
    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = URL.createObjectURL(blob);
    els.player.src = currentBlobUrl;

    els.playBtn.disabled = false;
    els.downloadBtn.disabled = false;
    setStatus('Готово. Можно прослушать или скачать файл.', 'ok');
  } catch (e) {
    setStatus('Ошибка: ' + e.message, 'err');
  } finally {
    setBusy(false);
  }
});

els.playBtn.addEventListener('click', () => {
  if (!currentBlobUrl) return;
  els.player.play();
  startMeter();
});

els.downloadBtn.addEventListener('click', () => {
  if (!currentBlobUrl) return;
  const a = document.createElement('a');
  a.href = currentBlobUrl;
  a.download = 'tts_output.mp3';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

// Сигнатурный элемент: живой аудио-метр
const canvas = document.getElementById('meter');
const ctx2d = canvas.getContext('2d');
let audioCtx, analyser, source, dataArray, rafId;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function ensureAudioGraph() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  source = audioCtx.createMediaElementSource(els.player);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function startMeter() {
  ensureAudioGraph();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  cancelAnimationFrame(rafId);
  drawMeter();
}

function barColor(v) {
  if (v < 130) return '#35D68A';
  if (v < 190) return '#FFB020';
  return '#FF5D5D';
}

function drawMeter() {
  rafId = requestAnimationFrame(drawMeter);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx2d.clearRect(0, 0, w, h);

  if (analyser && !els.player.paused) {
    analyser.getByteFrequencyData(dataArray);
  } else if (dataArray) {
    for (let i = 0; i < dataArray.length; i++) dataArray[i] = Math.max(0, dataArray[i] - 6);
  } else {
    dataArray = new Uint8Array(48);
  }

  const bars = 48;
  const step = Math.floor(dataArray.length / bars) || 1;
  const gap = 3;
  const barW = (w - gap * (bars - 1)) / bars;

  for (let i = 0; i < bars; i++) {
    const v = dataArray[i * step] || 0;
    const barH = Math.max(3, (v / 255) * (h - 12));
    const x = i * (barW + gap);
    const y = h - barH - 6;
    ctx2d.fillStyle = barColor(v);
    ctx2d.globalAlpha = 0.9;
    ctx2d.fillRect(x, y, barW, barH);
  }
}
drawMeter();

// Инициализация
loadVoices();
</script>
